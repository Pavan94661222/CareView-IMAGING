# Cloud Build configuration (optional — only needed if you prefer
# building the image with Cloud Build instead of `gcloud run deploy --source`).
#
# Usage:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_SERVICE=pneumonia-api,_REGION=us-central1

steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/${_SERVICE}", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/${_SERVICE}"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--image=gcr.io/$PROJECT_ID/${_SERVICE}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--memory=2Gi"
      - "--cpu=1"
      - "--set-env-vars=PNEUMONIA_CORS_ORIGINS=https://careview-imaging.netlify.app,PNEUMONIA_MODEL_PATH=/app/models/pneumonia_classifier.keras,PNEUMONIA_METADATA_PATH=/app/models/model_metadata.json,TF_CPP_MIN_LOG_LEVEL=3,TF_ENABLE_ONEDNN_OPTS=0"

substitutions:
  _SERVICE: pneumonia-api
  _REGION: us-central1

images:
  - "gcr.io/$PROJECT_ID/${_SERVICE}"

options:
  logging: CLOUD_LOGGING_ONLY
