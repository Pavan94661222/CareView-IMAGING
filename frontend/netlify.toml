# Netlify deployment configuration for the Pneumonia Detection frontend.
#
# In the Netlify dashboard:
#   Base directory : frontend
#   Build command  : npm run build
#   Publish dir    : dist
#
# Set the build-time environment variable VITE_API_BASE_URL to your Render
# backend URL, e.g. https://pneumonia-api.onrender.com

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Override this in the Netlify dashboard (Environment variables) with your
  # live backend origin, e.g. https://pneumonia-api.onrender.com
  VITE_API_BASE_URL = ""

# SPA fallback: serve index.html for any unknown route so React Router works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the hashed build assets for performance.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
